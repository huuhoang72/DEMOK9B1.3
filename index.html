<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      // Compatibility shim: Ensure window.fetch has both getter and setter
      // to prevent browser extensions from throwing "Cannot set property fetch of #<Window> which has only a getter"
      (function() {
        try {
          var _currentFetch = window.fetch;
          Object.defineProperty(window, 'fetch', {
            get: function() {
              return _currentFetch;
            },
            set: function(val) {
              _currentFetch = val;
            },
            configurable: true,
            enumerable: true
          });
        } catch (_) {}
      })();
    </script>
